# PostgreSQL profile — activate with --spring.profiles.active=postgres
# (or SPRING_PROFILES_ACTIVE=postgres).
#
# The connection comes entirely from environment variables; there is no
# host, username or password in this file. If SPRING_DATASOURCE_URL is
# not set the service fails fast at startup instead of silently
# falling back to the in-memory database.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Explicit dialect — Spring Boot would also auto-detect it from the driver.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Create the tables on first run and keep them afterwards. For a real
# production deployment use ddl-auto=validate with Flyway migrations
# instead of update — see the README.
spring.jpa.hibernate.ddl-auto=update

# Hikari connection pool: small on purpose. A KYC service is
# request-driven, not connection-hungry; 10 connections is plenty for
# a single instance, and Supabase's free tier limits connections.
spring.datasource.hikari.pool-name=kyc-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.h2.console.enabled=false
