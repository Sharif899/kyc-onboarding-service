spring.application.name=kyc-onboarding-service
server.port=8080

# In-memory H2: the service runs anywhere with no external database.
# For a real deployment, point this at PostgreSQL and set
# spring.jpa.hibernate.ddl-auto=validate with Flyway migrations.
spring.datasource.url=jdbc:h2:mem:kycdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false
