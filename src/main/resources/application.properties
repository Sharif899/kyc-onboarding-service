spring.application.name=kyc-onboarding-service
server.port=8080

# Default profile: in-memory H2. The service runs anywhere with no
# external database and no setup — `mvn test` and a plain
# `./mvnw spring-boot:run` both work out of the box.
#
# Every datasource setting below is environment-driven: set the
# SPRING_DATASOURCE_* variables to point at a real database instead.
# The H2 values are only the fallbacks when no variables are set.
# No secret is ever stored in this file.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:kycdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false
